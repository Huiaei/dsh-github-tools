# This bundle layer inserts the GitHub tool plugin process-wide, so every agent
# preset gets the `github` tools without declaring anything.
#
# Do NOT also add a `github-tools` row to a preset. DSH registers tools by name
# and a second registration of the same tool fails. To keep the tools out of a
# composition, override this row by id in a later patch layer (`- id: github-tools`
# with `disabled: true`) instead of duplicating it.
#
# Installing this bundle changes nothing else: no other plugin is touched.
#
# The entry name is the BARE PACKAGE NAME on purpose, not a relative path.
# `dsh-client-modules` attaches a package's browser half to the Loader row whose
# specifier is the bare package name, so the row configuration page registered by
# `client/index.js` (slot `plugins.row.config`, key `dsh-github-tools#github-tools`)
# only exists while this row is addressed this way. pnpm installs the package under
# its own name, so `dsh-github-tools` always resolves to this bundle's entry.

- insert:
    - id: github-tools
      name: 'dsh-github-tools'
      config:
        # The token is read from GITHUB_PERSONAL_ACCESS_TOKEN (then GITHUB_TOKEN,
        # then GH_TOKEN) when this is left empty. Prefer the environment variable
        # or the credentials service over committing a token here.
        token: ''
        # Upstream default tool set. Use ['all'] for all 131 tools, or name
        # individual toolsets: repos, issues, pull_requests, users, context,
        # actions, code_security, dependabot, discussions, gists, governance,
        # labels, notifications, projects, security_advisories, copilot, …
        toolsets:
          - default
        # Register only the tools the upstream server marks read-only.
        readOnly: false
